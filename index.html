<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #viewport {
            display: none;
            height: 35vh;
            background-color: #050505;
            border-bottom: 2px solid #ffffff;
            position: relative;
        }
        #terminal-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            background-color: #000000;
        }
        #output-screen {
            flex-grow: 1;
            background-color: #000000;
            border: 1px solid #333333;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
            color: #ffffff;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            margin-top: 15px;
            border-top: 1px solid #333333;
            padding-top: 10px;
        }
        .prompt-symbol {
            color: #ffffff;
            font-weight: bold;
            margin-right: 10px;
            font-size: 16px;
        }
        #commandInput {
            flex-grow: 1;
            background-color: #000000;
            color: #ffffff;
            border: none;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas-target" style="width:100%; height:100%;"></div>
    </div>

    <div id="terminal-container">
        <div id="output-screen">CYPHER ENGINE v2.0 [Minimalist B&W Mode]
Type /help to view all available system commands and instruction manuals.</div>
        
        <div class="input-wrapper">
            <span class="prompt-symbol">&gt;</span>
            <input type="text" id="commandInput" placeholder="Enter command..." autofocus autocomplete="off">
        </div>
    </div>

    <script>
        const outputScreen = document.getElementById("output-screen");
        const commandInput = document.getElementById("commandInput");
        const viewport = document.getElementById("viewport");

        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight * 0.35), 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight * 0.35);
        document.getElementById("canvas-target").appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        let activeMesh = null;
        camera.position.z = 4;

        function renderCustomScene(data) {
            if (activeMesh) scene.remove(activeMesh);
            
            let geometry;
            if (data.shape === "sphere") geometry = new THREE.SphereGeometry(data.size || 1, 32, 32);
            else if (data.shape === "cylinder") geometry = new THREE.CylinderGeometry(data.size || 0.5, data.size || 0.5, (data.size || 1) * 2, 32);
            else if (data.shape === "torus") geometry = new THREE.TorusGeometry(data.size || 1, 0.4, 16, 100);
            else geometry = new THREE.BoxGeometry(data.size || 1, data.size || 1, data.size || 1);

            let materialParams = { color: data.color || 0xffffff };
            
            if (data.textureImage) {
                const textureLoader = new THREE.TextureLoader();
                materialParams.map = textureLoader.load(data.textureImage);
            }

            let material = new THREE.MeshStandardMaterial(materialParams);
            activeMesh = new THREE.Mesh(geometry, material);
            scene.add(activeMesh);
        }

        // Gameplay state & keyboard event listeners
        const keysPressed = {};
        window.addEventListener('keydown', (e) => { keysPressed[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keysPressed[e.key.toLowerCase()] = false; });

        let gameModeActive = false;

        function animate() {
            requestAnimationFrame(animate);

            if (activeMesh) {
                if (gameModeActive) {
                    if (keysPressed['arrowleft'] || keysPressed['a']) activeMesh.position.x -= 0.05;
                    if (keysPressed['arrowright'] || keysPressed['d']) activeMesh.position.x += 0.05;
                    if (keysPressed['arrowup'] || keysPressed['w']) activeMesh.position.z -= 0.05;
                    if (keysPressed['arrowdown'] || keysPressed['s']) activeMesh.position.z += 0.05;
                    
                    if (activeMesh.position.y > 0) {
                        activeMesh.position.y -= 0.02;
                    }
                } else {
                    activeMesh.rotation.x += 0.01;
                    activeMesh.rotation.y += 0.015;
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        commandInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                let cmd = commandInput.value.trim();
                if (!cmd) return;

                appendOutput(`\n> ${cmd}`);
                let response = routeCommand(cmd);
                appendOutput(response);

                commandInput.value = "";
                outputScreen.scrollTop = outputScreen.scrollHeight;
            }
        });

        function appendOutput(text) {
            outputScreen.innerText += text;
        }

        function routeCommand(cmd) {
            if (cmd === "/help") {
                return `
--------------------------------------------------
CYPHER ENGINE MASTER COMMAND DIRECTORY:
--------------------------------------------------
  /help               - Displays this comprehensive command manual.
  /mode 3d            - Opens the top 3D viewport canvas window.
  /mode 2d            - Switches system focus to grid environment.
  /play               - Initializes interactive gameplay and physics runner.
  /stop               - Exits play mode and returns to editor console.
  /clear              - Clears the active text display terminal screen.
  /status             - Displays core diagnostic data and memory loads.
  /insert [string]    - Imports a packed world string generated from 
                        the Cypher Builder Studio website.
--------------------------------------------------`;
            }
            if (cmd === "/clear") {
                outputScreen.innerText = "";
                return "";
            }
            if (cmd === "/status") {
                return "\n[SYSTEM STATUS] Engine: Online | Theme: Monolith B&W | Memory: Optimal | Physics: Active";
            }
            if (cmd === "/mode 3d") {
                viewport.style.display = "block";
                return "\n>> 3D Viewport activated successfully at top.";
            }
            if (cmd === "/mode 2d") {
                viewport.style.display = "none";
                gameModeActive = false;
                return "\n>> Switched to 2D Terminal Grid layout mode.";
            }
            if (cmd === "/play") {
                if (!activeMesh) {
                    return "\n>> [ERROR] No asset found in viewport. Use /insert [string] first!";
                }
                gameModeActive = true;
                return `
--------------------------------------------------
PLAY ENGINE RUNNER: INITIALIZED
--------------------------------------------------
  Status: Live Gameplay Active
  Controls: Use Arrow Keys / WASD to move your asset.
  Type /stop to exit play mode and return to console.
--------------------------------------------------`;
            }
            if (cmd === "/stop") {
                gameModeActive = false;
                return "\n>> Play engine deactivated. Returned to command terminal.";
            }
            if (cmd.startsWith("/insert ")) {
                let codeString = cmd.substring(8).trim();
                try {
                    let decoded = JSON.parse(atob(codeString));
                    viewport.style.display = "block";
                    renderCustomScene(decoded);
                    return `\n>> Successfully imported project asset! Shape: [${decoded.shape}], Physics: [${decoded.physics}], AI Logic: [${decoded.aiPrompt || 'None'}].`;
                } catch (e) {
                    return "\n>> [ERROR] Invalid import string formatting. Check your builder export code.";
                }
            }
            return `\n>> Unknown execution string: "${cmd}". Type /help for valid syntax.`;
        }
    </script>
</body>
</html>
