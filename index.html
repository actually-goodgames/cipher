   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Programming Language</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal {
            flex-grow: 1;
            background-color: #000000;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
        }
        .input-line {
            display: flex;
            align-items: center;
            background-color: #000000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: monospace;
            font-size: 16px;
            outline: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="terminal">==================================================
Welcome to Cypher, the easiest coding language!
==================================================
Type /help to get the help menu.
Type /exit to quit.
--------------------------------------------------

</div>

    <div class="input-line">
        <span>Cypher &gt;&nbsp;</span>
        <input type="text" id="userInput" autofocus autocomplete="off">
    </div>

    <script>
        const terminal = document.getElementById("terminal");
        const userInput = document.getElementById("userInput");
        
        let variables = {};
        let canvas = Array(10).fill().map(() => Array(10).fill("."));

        document.addEventListener("click", () => userInput.focus());

        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                let line = userInput.value.trim();
                terminal.innerHTML += "Cypher > " + line + "\n\n";
                
                let output = processCommand(line);
                if (output) {
                    terminal.innerHTML += output + "\n\n";
                }
                
                terminal.scrollTop = terminal.scrollHeight;
                userInput.value = "";
            }
        });

        const FULL_HELP_TEXT = 
`==================================================
          WELCOME TO CYPHER HELP GUIDE     
==================================================

(Note: All commands are CASE-INSENSITIVE!)

1. VARIABLES & PRINTING:
   "Thomas" = "h"     -> Saves "Thomas" inside variable "h"
   SHOW "h"           -> Prints whatever is stored inside "h"

2. RUNNING SCRIPTS / FILES:
   RUN "test.txt"     -> Runs all code lines saved in a file

3. SPRITE / GRAPHICS COMMANDS:
   /DRAW              -> Displays your 10x10 sprite grid
   /PIXEL X Y         -> Draws a pixel at coordinates X Y (e.g. /PIXEL 3 4)
   /CLEARCANVAS       -> Clears the sprite board

4. SYSTEM COMMANDS:
   /HELP              -> Shows this manual
   /RESET             -> Clears memory and screen
   /EXIT              -> Quits the interpreter
==================================================`;

        function processCommand(line) {
            let cmd = line.toLowerCase();
            
            if (cmd === "/help") {
                return FULL_HELP_TEXT;
            } else if (cmd === "/reset") {
                variables = {};
                canvas = Array(10).fill().map(() => Array(10).fill("."));
                terminal.innerHTML = "==================================================\nWelcome to Cypher, the easiest coding language!\n==================================================\nType /help to get the help menu.\nType /exit to quit.\n--------------------------------------------------\n\n";
                return ">> Memory and screen cleared!";
            } else if (cmd === "/exit") {
                return "Exiting language engine...";
            } else if (cmd === "/draw") {
                return ">> Sprite Grid (10x10):\n" + canvas.map(row => row.join(" ")).join("\n");
            } else if (cmd === "/clearcanvas") {
                canvas = Array(10).fill().map(() => Array(10).fill("."));
                return ">> Canvas cleared!";
            } else if (cmd.startsWith("/pixel ")) {
                let parts = line.split(" ");
                if (parts.length >= 3) {
                    let x = parseInt(parts[1]);
                    let y = parseInt(parts[2]);
                    if (x >= 0 && x < 10 && y >= 0 && y < 10) {
                        canvas[y][x] = "#";
                        return `>> Pixel drawn at (${x}, ${y})`;
                    }
                    return ">> Error: Coordinates must be between 0 and 9.";
                }
                return ">> Error: Use format /PIXEL X Y";
            } else if (cmd.startsWith("show ")) {
                let content = line.substring(5).trim();
                if (variables.hasOwnProperty(content)) {
                    return ">> Output: " + variables[content];
                }
                try {
                    let mathRes = eval(content);
                    if (!isNaN(mathRes)) return ">> Output: " + mathRes;
                } catch(e) {}
                return ">> Output: " + content;
            } else if (line.includes("=")) {
                let parts = line.split("=");
                let varName = parts[0].trim();
                let valRaw = parts[1].trim();
                variables[varName] = valRaw;
                return `>> [MEMORY] Saved '${valRaw}' to variable '${varName}'`;
            }
            return `>> [NATURAL LANGUAGE] Processed intent for: '${line}'`;
        }
    </script>
</body>
</html>
