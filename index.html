<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Game Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #game-viewport {
            width: 100%;
            height: 40vh;
            background-color: #050505;
            border: 1px solid #333;
            border-radius: 5px;
            margin-bottom: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        #canvas-2d {
            font-family: monospace;
            white-space: pre;
            font-size: 14px;
            line-height: 1.2;
            color: #ffffff;
            display: none;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            display: none;
        }
        #terminal {
            flex-grow: 1;
            background-color: #000000;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.4;
        }
        .input-line {
            display: flex;
            align-items: center;
            background-color: #000000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: monospace;
            font-size: 16px;
            outline: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="canvas-2d"></div>
        <div id="webgl-container"></div>
    </div>

    <div id="terminal">==================================================
Welcome to Cypher Game Engine!
Type commands or talk in plain English.
==================================================
Type /help to get the help menu.
Type /exit to quit.
--------------------------------------------------

</div>

    <div class="input-line">
        <span>Cypher &gt;&nbsp;</span>
        <input type="text" id="userInput" autofocus autocomplete="off">
    </div>

    <script>
        // --- 3D ENGINE SETUP (Three.js) ---
        const webglContainer = document.getElementById("webgl-container");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, webglContainer.clientWidth / webglContainer.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(webglContainer.clientWidth, webglContainer.clientHeight);
        webglContainer.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        let geometry = new THREE.BoxGeometry();
        let material = new THREE.MeshStandardMaterial({ color: 0xffffff });
        let currentObject = new THREE.Mesh(geometry, material);
        scene.add(currentObject);
        camera.position.z = 3;

        function animate3D() {
            requestAnimationFrame(animate3D);
            currentObject.rotation.x += 0.01;
            currentObject.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate3D();

        // --- 2D & VIEWPORT SETUP ---
        let grid2D = Array(10).fill().map(() => Array(10).fill("."));
        let player2D = { x: 0, y: 0, symbol: "P" };
        const viewport = document.getElementById("game-viewport");
        const canvas2dEl = document.getElementById("canvas-2d");
        const webglEl = document.getElementById("webgl-container");

        function update2DDisplay() {
            let gridView = grid2D.map((row, y) => {
                return row.map((cell, x) => {
                    if (x === player2D.x && y === player2D.y) return player2D.symbol;
                    return cell;
                }).join(" ");
            }).join("\n");
            canvas2dEl.innerText = gridView;
        }

        // --- TERMINAL SETUP ---
        const terminal = document.getElementById("terminal");
        const userInput = document.getElementById("userInput");
        let variables = {};

        document.addEventListener("click", () => userInput.focus());

        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                let line = userInput.value.trim();
                terminal.innerHTML += "Cypher > " + line + "\n\n";
                
                let output = processCommand(line);
                if (output) {
                    terminal.innerHTML += output + "\n\n";
                }
                
                terminal.scrollTop = terminal.scrollHeight;
                userInput.value = "";
            }
        });

        const FULL_HELP_TEXT = 
`==================================================
        CYPHER GAME & HELP GUIDE     
==================================================

1. NATURAL LANGUAGE PHRASING:
   - "Make a red cube" -> Spawns a red 3D cube
   - "Turn it blue" -> Changes 3D shape color
   - "Switch to 2D grid" -> Opens 2D game map

2. 2D & 3D COMMANDS:
   /mode 2d /start2d  -> Open 2D grid mode
   /mode 3d = cube    -> Open 3D cube mode
   /mode 3d = sphere  -> Open 3D sphere mode
   /move up/down      -> Move player in 2D

3. SYSTEM COMMANDS:
   /help              -> Shows this help menu
   /reset             -> Clears memory and screens
   /exit              -> Quits interpreter
==================================================`;

        function processCommand(line) {
            let cmd = line.toLowerCase();
            
            // --- NATURAL LANGUAGE PARSING ---
            if (cmd.includes("red")) {
                material.color.setHex(0xff0000);
                return ">> Changed color to Red.";
            }
            if (cmd.includes("blue")) {
                material.color.setHex(0x38bdf8);
                return ">> Changed color to Blue.";
            }
            if (cmd.includes("white")) {
                material.color.setHex(0xffffff);
                return ">> Changed color to White.";
            }
            if (cmd.includes("cube") && (cmd.includes("make") || cmd.includes("spawn") || cmd.includes("show"))) {
                viewport.style.display = "flex";
                canvas2dEl.style.display = "none";
                webglEl.style.display = "block";
                scene.remove(currentObject);
                geometry = new THREE.BoxGeometry();
                currentObject = new THREE.Mesh(geometry, material);
                scene.add(currentObject);
                return ">> Spawning a 3D cube.";
            }
            if (cmd.includes("sphere") && (cmd.includes("make") || cmd.includes("spawn") || cmd.includes("show"))) {
                viewport.style.display = "flex";
                canvas2dEl.style.display = "none";
                webglEl.style.display = "block";
                scene.remove(currentObject);
                geometry = new THREE.SphereGeometry(0.7, 32, 32);
                currentObject = new THREE.Mesh(geometry, material);
                scene.add(currentObject);
                return ">> Spawning a 3D sphere.";
            }
            if (cmd.includes("2d") && (cmd.includes("switch") || cmd.includes("mode") || cmd.includes("open"))) {
                viewport.style.display = "flex";
                webglEl.style.display = "none";
                canvas2dEl.style.display = "block";
                update2DDisplay();
                return ">> Switching to 2D view.";
            }

            // --- STANDARD COMMAND PARSING ---
            if (cmd === "/help") {
                return FULL_HELP_TEXT;
            } else if (cmd === "/reset") {
                variables = {};
                grid2D = Array(10).fill().map(() => Array(10).fill("."));
                player2D = { x: 0, y: 0, symbol: "P" };
                viewport.style.display = "none";
                canvas2dEl.style.display = "none";
                webglEl.style.display = "none";
                terminal.innerHTML = "==================================================\nWelcome to Cypher Game Engine!\nType commands or talk in plain English.\n==================================================\n\n";
                return ">> System reset complete.";
            } else if (cmd === "/exit") {
                return "Exiting language engine...";
            } else if (cmd === "/mode 2d" || cmd === "/start2d") {
                viewport.style.display = "flex";
                webglEl.style.display = "none";
                canvas2dEl.style.display = "block";
                player2D = { x: 0, y: 0, symbol: "P" };
                grid2D = Array(10).fill().map(() => Array(10).fill("."));
                update2DDisplay();
                return ">> Switched to 2D Game Mode.";
            } else if (cmd === "/mode 3d = cube") {
                viewport.style.display = "flex";
                canvas2dEl.style.display = "none";
                webglEl.style.display = "block";
                scene.remove(currentObject);
                geometry = new THREE.BoxGeometry();
                currentObject = new THREE.Mesh(geometry, material);
                scene.add(currentObject);
                return ">> 3D Cube spawned!";
            } else if (cmd === "/mode 3d = sphere") {
                viewport.style.display = "flex";
                canvas2dEl.style.display = "none";
                webglEl.style.display = "block";
                scene.remove(currentObject);
                geometry = new THREE.SphereGeometry(0.7, 32, 32);
                currentObject = new THREE.Mesh(geometry, material);
                scene.add(currentObject);
                return ">> 3D Sphere spawned!";
            } else if (cmd === "/move up") {
                if (player2D.y > 0) player2D.y--;
                update2DDisplay();
                return ">> Moved UP";
            } else if (cmd === "/move down") {
                if (player2D.y < 9) player2D.y++;
                update2DDisplay();
                return ">> Moved DOWN";
            } else if (cmd === "/move left") {
                if (player2D.x > 0) player2D.x--;
                update2DDisplay();
                return ">> Moved LEFT";
            } else if (cmd === "/move right") {
                if (player2D.x < 9) player2D.x++;
                update2DDisplay();
                return ">> Moved RIGHT";
            } else if (line.includes("=")) {
                let parts = line.split("=");
                let varName = parts[0].trim();
                let valRaw = parts[1].trim();
                variables[varName] = valRaw;
                return `>> [MEMORY] Saved '${valRaw}' to variable '${varName}'`;
            }
            return `>> [CYPHER] Processed input: '${line}'`;
        }
    </script>
</body>
</html>
