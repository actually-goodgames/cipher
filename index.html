<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #viewport {
            flex-grow: 1;
            position: relative;
            background-color: #030712;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #terminal {
            height: 200px;
            background-color: #111827;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #output-screen {
            flex-grow: 1;
            background-color: #030712;
            border: 1px solid #374151;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            color: #34d399;
            border-radius: 4px;
        }
        .input-line {
            display: flex;
            gap: 10px;
        }
        #commandInput {
            flex-grow: 1;
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #4b5563;
            padding: 10px;
            font-family: monospace;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas-container"></div>
    </div>

    <div id="terminal">
        <div id="output-screen">>> Cypher Engine Initialized. Type /help for a list of commands.</div>
        <div class="input-line">
            <span style="color: #38bdf8; align-self: center;">&gt;</span>
            <input type="text" id="commandInput" placeholder="Type a command here (e.g. /help, /insert [code])..." autofocus>
        </div>
    </div>

    <script>
        // --- 1. THREE.JS VIEWPORT SETUP ---
        const container = document.getElementById("canvas-container");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(400, 300); // Initial size of viewport render box
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        let activeMesh = null;
        camera.position.z = 3;

        function renderShape(shapeType, colorHex = "#38bdf8") {
            if (activeMesh) scene.remove(activeMesh);
            
            let geometry;
            if (shapeType === "sphere") geometry = new THREE.SphereGeometry(0.7, 32, 32);
            else if (shapeType === "cylinder") geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32);
            else geometry = new THREE.BoxGeometry(); // Default box

            let material = new THREE.MeshStandardMaterial({ color: colorHex });
            activeMesh = new THREE.Mesh(geometry, material);
            scene.add(activeMesh);
        }

        // Default initial shape
        renderShape("box");

        function animate() {
            requestAnimationFrame(animate);
            if (activeMesh) {
                activeMesh.rotation.x += 0.005;
                activeMesh.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. TERMINAL COMMAND ROUTER & IMPORT HANDLER ---
        const outputScreen = document.getElementById("output-screen");
        const commandInput = document.getElementById("commandInput");

        commandInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                let line = commandInput.value.trim();
                if (!line) return;

                // Print user input to terminal screen
                appendOutput(`> ${line}`);
                
                // Process command response
                let response = processCypherCommand(line);
                appendOutput(response);

                // Clear input field
                commandInput.value = "";
                outputScreen.scrollTop = outputScreen.scrollHeight;
            }
        });

        function appendOutput(text) {
            outputScreen.innerHTML += `<div>${text}</div>`;
        }

        function processCypherCommand(line) {
            // Help Command
            if (line === "/help") {
                return ">> Commands: /help, /mode 3d, /insert [paste builder code string]";
            }

            // Mode Command
            if (line === "/mode 3d") {
                renderShape("box");
                return ">> Switched viewport to 3D standard mode.";
            }

            // --- IMPORT COMMAND (Bridges Builder Website to Cypher) ---
            if (line.startsWith("/insert ")) {
                let codeString = line.substring(8).trim();
                
                try {
                    // 1. Decode base64 string back into JSON text
                    let decodedJson = atob(codeString);
                    
                    // 2. Parse text into a JavaScript object
                    let gameData = JSON.parse(decodedJson);
                    
                    // 3. Apply imported design to the main engine viewport
                    renderShape(gameData.shape, gameData.color);
                    
                    return `>> Success! Inserted asset: Shape [${gameData.shape}], Model [${gameData.gender}], Outfit [${gameData.outfit}].`;
                    
                } catch (error) {
                    return ">> Error: Invalid code string. Make sure you copied the entire base64 string from your builder studio!";
                }
            }

            return `>> Unknown command: "${line}". Type /help for options.`;
        }
    </script>
</body>
</html>
